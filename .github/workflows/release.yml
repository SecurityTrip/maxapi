name: Release

# Publishes to Maven Central when a GitHub release is published. The version comes from the
# release tag: v1.2.3 -> 1.2.3. Can also be run by hand to retry a failed release.
# Release notes come from the matching section of CHANGELOG.md; stable releases also update the
# API reference on GitHub Pages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to put the changelog section into the GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${TAG#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::'$version' is not a release version like 1.2.3 or 1.2.3-rc1 (tag: '$TAG')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          missing=""
          [ -n "$MAVEN_CENTRAL_USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$MAVEN_CENTRAL_PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$GPG_SIGNING_KEY" ] || missing="$missing GPG_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see 'Releasing' in README.en.md)"
            exit 1
          fi

      # Fails before anything is published if CHANGELOG.md has no section for the version.
      # A pre-release (1.2.3-rc1) falls back to the section of its final version (1.2.3).
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          section() {
            awk -v v="$1" '
              /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
              /^\[[^]]+\]: / { if (found) exit }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d'
          }
          section "$VERSION" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            section "${VERSION%%-*}" > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' or '## [${VERSION%%-*}]' section"
            exit 1
          fi

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # :dokkaGenerate builds the reference of all modules for GitHub Pages in build/dokka/html.
        run: ./gradlew build :dokkaGenerate -PreleaseVersion="$VERSION"

      - name: Publish to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral -PreleaseVersion="$VERSION" --no-configuration-cache

      - name: Update release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

      - name: Upload API reference
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/dokka/html

  # Pre-releases (rc, beta) do not replace the documentation of the latest stable version.
  docs:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
